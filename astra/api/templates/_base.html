<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Astra{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body hx-ext="sse" sse-connect="/sse/events">
  <header class="topbar">
    <div class="brand">
      <span class="logo">▲</span>
      <span class="brand-name">Astra</span>
      <span class="badge paper">PAPER</span>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/trades">Trades</a>
      <a href="/performance">Performance</a>
      <a href="/profiles">Profiles</a>
      <a href="/experts">Experts</a>
      <a href="/memory">Memory</a>
      <a href="/backtest">Backtest</a>
      <a href="/training">Training</a>
      <a href="/settings">Settings</a>
    </nav>
    <div class="status-pill"
         hx-get="/api/status"
         hx-trigger="load, every 5s, sse:trade, sse:equity"
         hx-swap="innerHTML"
         id="status-pill">
      …
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
