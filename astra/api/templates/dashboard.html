{% extends "_base.html" %}
{% block title %}Astra — Dashboard{% endblock %}
{% block content %}
<section id="summary"
         hx-get="/api/summary"
         hx-trigger="load, every 8s, sse:trade from:body, sse:equity from:body"
         hx-swap="innerHTML">…</section>

<section class="grid-2">
  <div class="card">
    <h2>Equity</h2>
    <canvas id="equity-chart" height="120"></canvas>
  </div>

  <div class="card">
    <h2>Positions
      <button class="btn small" hx-post="/api/engine/tick" hx-swap="none">Force tick</button>
      <button class="btn small" hx-post="/api/engine/reflect" hx-swap="none">Reflect now</button>
    </h2>
    <div id="positions"
         hx-get="/api/positions"
         hx-trigger="load, every 10s, sse:trade from:body"
         hx-swap="innerHTML">…</div>
  </div>
</section>

<section class="card">
  <h2>AI thoughts (live)
    <span class="muted small" id="thought-count"></span>
  </h2>
  <div id="thoughts"
       hx-get="/api/thoughts"
       hx-trigger="load, every 6s, sse:thought from:body"
       hx-swap="innerHTML">…</div>
</section>

<section class="card">
  <h2>Universe scan (last tick)
    <span class="muted small">— top candidates by signal strength + momentum</span>
  </h2>
  <div id="scan"
       hx-get="/api/scan"
       hx-trigger="load, every 15s, sse:equity from:body"
       hx-swap="innerHTML">…</div>
</section>

<section class="card">
  <h2>Recent trades</h2>
  <div id="recent-trades"
       hx-get="/api/trades-table"
       hx-trigger="load, every 12s, sse:trade from:body"
       hx-swap="innerHTML">…</div>
</section>

<script>
window.__astra_init = function () {
  // ---- Equity chart ----
  const ctx = document.getElementById('equity-chart');
  let chart = null;
  if (ctx) {
    chart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Equity ($)', data: [], borderColor: '#3aa', tension: 0.2, fill: false, pointRadius: 0 }] },
      options: { responsive: true, animation: false, plugins: { legend: { display: false } },
                 scales: { x: { display: false }, y: { ticks: { color: '#aaa' } } } }
    });
  }
  async function refreshEquity() {
    if (!chart) return;
    try {
      const r = await fetch('/api/equity?limit=500');
      const d = await r.json();
      chart.data.labels = d.points.map(p => p.ts);
      chart.data.datasets[0].data = d.points.map(p => p.equity);
      chart.update('none');
    } catch (e) {}
  }
  refreshEquity();
  setInterval(refreshEquity, 15000);

  // ---- Listen to SSE for live refreshes that HTMX can't do (chart) ----
  // HTMX has its own SSE connection via sse-connect on <body>; we also listen
  // here independently so the chart can refresh without HTML swaps.
  if (window.EventSource) {
    const es = new EventSource('/sse/events');
    es.addEventListener('equity', refreshEquity);
    es.addEventListener('trade', refreshEquity);
    es.addEventListener('thought', (e) => {
      try {
        const d = JSON.parse(e.data);
        const el = document.getElementById('thought-count');
        if (el) {
          el.textContent = `· last: ${d.symbol} ${d.action} (${(d.confidence||0).toFixed(2)})`;
        }
      } catch (_) {}
    });
    es.addEventListener('error', () => {
      // Browser will reconnect automatically — no need to do anything.
    });
  }

  // ---- Next-tick countdown ----
  // The status pill is re-rendered server-side every 5s with data attrs
  // (last_tick + tick_seconds); we update a relative countdown each second.
  function updateCountdown() {
    const pill = document.querySelector('#status-pill .status-cluster');
    const out = document.getElementById('next-tick');
    if (!pill || !out) return;
    const lastTick = parseFloat(pill.dataset.lastTick);
    const tickSec = parseInt(pill.dataset.tickSeconds, 10) || 300;
    if (!lastTick || isNaN(lastTick)) {
      out.textContent = 'soon';
      return;
    }
    const now = Date.now() / 1000;
    const elapsed = now - lastTick;
    const remaining = Math.max(0, tickSec - elapsed);
    if (remaining < 1) {
      out.textContent = 'now…';
    } else if (remaining < 60) {
      out.textContent = `${Math.round(remaining)}s`;
    } else {
      const m = Math.floor(remaining / 60);
      const s = Math.round(remaining % 60);
      out.textContent = `${m}m ${s}s`;
    }
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();
};
</script>
{% endblock %}
