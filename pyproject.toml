[project]
name = "astra"
version = "0.1.0"
description = "Local AI paper-trading platform for S&P 500"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta-classic>=0.3.0; python_version>='3.11'",
    "openai>=1.30",
    "websockets>=12.0",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
